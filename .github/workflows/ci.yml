name: CI

on:
    push:
        branches:
            - main
            - master
    pull_request: { }

concurrency:
    group: ci-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: "Lint"
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v5
            -   name: Install Node
                uses: actions/setup-node@v5
                with:
                    node-version: 24
                    cache: npm
            -   name: Install Dependencies
                run: npm ci
            -   name: Lint
                run: npm run lint

    build:
        name: "Build"
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v5
            -   name: Install Node
                uses: actions/setup-node@v5
                with:
                    node-version: 24
                    cache: npm
            -   name: Install Dependencies
                run: npm ci
            -   name: Build
                run: npm run build
